<!--
  Mermaid 11 (CDN). We pick the theme based on the current doxygen-awesome
  light/dark mode and re-render diagrams whenever the toggle flips, so the
  architecture diagram stays legible in both modes.
-->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

  function pickMermaidTheme() {
    // doxygen-awesome adds "dark-mode" / "light-mode" classes to <html>.
    const cl = document.documentElement.classList;
    const isDark = cl.contains("dark-mode") ||
                   (!cl.contains("light-mode") && window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches);
    return isDark ? "dark" : "default";
  }

  function renderMermaid() {
    mermaid.initialize({
      startOnLoad: false,
      theme: pickMermaidTheme(),
      securityLevel: "loose",
      flowchart: { htmlLabels: true, curve: "basis" }
    });
    document.querySelectorAll("pre.mermaid, div.mermaid").forEach(el => {
      // Preserve the source so we can re-render after a theme switch.
      if (!el.dataset.mermaidSource) el.dataset.mermaidSource = el.textContent;
      el.textContent = el.dataset.mermaidSource;
      el.removeAttribute("data-processed");
    });
    mermaid.run({ querySelector: "pre.mermaid, div.mermaid" });
  }

  document.addEventListener("DOMContentLoaded", renderMermaid);

  // Re-render when the user toggles dark mode.
  new MutationObserver(renderMermaid).observe(document.documentElement, {
    attributes: true, attributeFilter: ["class"]
  });
</script>
